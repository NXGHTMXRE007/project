<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Тренировка</h1>

  <a href="index.html" class="back-link">← Назад</a>

  <hr>

<select id="mode">
  <option value="eng-ru">Английский → Русский</option>
  <option value="ru-eng">Русский → Английский</option>
</select>

<label>Выберите категорию:</label>

<select id="trainCategory">
  <option value="all">Все категории</option>
  <option value="animals">Животные</option>
  <option value="food">Еда</option>
  <option value="people">Люди</option>
  <option value="objects">Предметы</option>
  <option value="colors">Цвета</option>
</select>

<div class="training-card">
  <p id="question" class="question"></p>
</div>

<input id="answer" class="answer-input" placeholder="Введите перевод">

<div class="buttons">
  <button class="check-btn" onclick="checkAnswer()">Проверить</button>
  <button class="hint-btn" onclick="showHint()">Подсказка</button>
  <button onclick="nextWord()">Следующее</button>
</div>
</div>
<p id="result" class="result"></p>
<script src="training.js"></script>
</body>
</html>
