<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обучение</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
<div class="theme-control">
  <span class="theme-label">Тема</span>
  <label class="theme-switch">
    <input type="checkbox" id="themeToggle">
    <span class="slider"></span>
  </label>
</div>
  <h1>Обучение</h1>

  <a href="index.html" class="back-link">← Назад</a>

  <hr>

  <label>Выберите категорию:</label>

  <select id="learnCategory">
    <option value="all">Все категории</option>
    <option value="animals">Животные</option>
    <option value="food">Еда</option>
    <option value="people">Люди</option>
    <option value="objects">Предметы</option>
    <option value="colors">Цвета</option>
  </select>

  <div class="learn-card">
    <p id="learnWord" class="word">Нажмите "Следующее слово"</p>
    <p id="learnTranslation" class="translation"></p>
  </div>

  <div class="buttons">
    <button onclick="showTranslation()">Показать перевод</button>
    <button onclick="nextLearnWord()">Следующее слово</button>
  </div>

</div>

<script src="learning.js"></script>

</body>
</html>
